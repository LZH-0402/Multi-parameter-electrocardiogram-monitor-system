// ============================================================================
// DCDEMO_F407 软件仿真初始化文件（Options for Target -> Debug -> Initialization File）
// ============================================================================
//
// 说明 1：仿真器只把程序段标记为可执行、数据段标记为可读写，片上外设地址空间
//         默认未映射，一访问 RCC / GPIO / USART 就报 error 65。这里显式开放。
//
// 说明 2：Cortex-M 复位时内核固定从 0x00000000 取向量表，但本工程 Flash 在
//         0x08000000。若没给 CPU DLL 加 -REMAP 参数，仿真器取不到复位向量，
//         PC 停在 0，反汇编窗口读 0x0000000C 时报
//         "error 65: access violation at 0x0000000C : no 'read' permission"。
//         下面 Setup() 手动把 SP / PC / VTOR 指向真实向量表，绕过这个问题。
//         根治办法：CPU DLL(SARMCM3.DLL) 的 Parameter 填 "-REMAP -MPU"
//         （Keil 官方 STM32F407IG 例程就是这么配的）。
//
// 说明 3：S2IN / S2OUT 是 DARMSTM.DLL 提供的 USART 虚拟寄存器，而 DARMSTM.DLL
//         只实现了 STM32F101 / F103 / F217 等 F1、F2 器件，不含 STM32F407，
//         所以下面两行在 F407 上必然报 error 30，保持注释状态。
//         串口屏联调只能在真实硬件上做（ST-Link 下载调试）。
//
MODE COM8 115200,0,8,1
ASSIGN COM8 <S2IN> S2OUT

